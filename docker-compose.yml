# Serviciile de infrastructură ale aplicației, pornite cu: docker compose up -d
services:
  db:
    image: postgres:18
    container_name: estudent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: estudent
      POSTGRES_USER: estudent
      POSTGRES_PASSWORD: estudent_dev   # parolă doar pentru dezvoltare locală
      TZ: Europe/Bucharest
    ports:
      - "5433:5432"   # portul 5433 al calculatorului -> portul 5432 din container
    volumes:
      - estudent-pgdata:/var/lib/postgresql   # datele rămân după oprirea containerului

  # Stocare de fișiere cu API compatibil S3 (SeaweedFS). În producție: un serviciu cloud S3.
  fisiere:
    image: chrislusf/seaweedfs:4.55
    container_name: estudent-fisiere
    restart: unless-stopped
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=100
    ports:
      - "8333:8333"   # API-ul S3
    volumes:
      - estudent-fisiere:/data
      - ./docker/s3.json:/etc/seaweedfs/s3.json:ro   # cheile de acces (doar pentru dezvoltare)

  # Server de email pentru dezvoltare: primește TOATE emailurile trimise de aplicație
  # și le arată într-o pagină web (http://localhost:8025). Nu trimite nimic mai departe.
  email:
    image: axllent/mailpit:v1.34.0
    container_name: estudent-email
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP: aici trimite aplicația
      - "8025:8025"   # interfața web în care citim emailurile

volumes:
  estudent-pgdata:
  estudent-fisiere:
